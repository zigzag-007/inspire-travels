name: Validate static deployments

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  deployment-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned build and test dependencies
        run: npm --prefix tests ci
      - name: Verify deployment settings and generated routes
        run: npm --prefix tests test
      - name: Build the deployment output
        run: npm --prefix tests run build
      - name: Install browser for deployment checks
        run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Check built routes, controls, and offline recovery
        run: npm --prefix tests run test:e2e
      - name: Check plain static source routes
        run: npm --prefix tests run test:source
